<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Verb Trainer</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <h1>Japanese Verb Trainer</h1>

    <section id="prompt-card" class="card">
      <h2>Prompt</h2>

      <div id="dictionary-row" class="prompt-row">
        <span class="label">Dictionary Form:</span>
        <span id="dictionary" class="value">---</span>
      </div>

      <div id="target-row" class="prompt-row">
        <span class="label">Target Form:</span>
        <span id="target-form" class="value">---</span>
      </div>

      <div class="prompt-row">
        <span class="label">Your Answer:</span>
        <input id="user-answer" class="answer-input" type="text" placeholder="Type in hiragana" enterkeyhint="done" />
      </div>

      <div class="prompt-actions">
        <button id="reveal-btn" type="button">Reveal</button>
        <button id="next-btn" type="button">Next</button>
      </div>
    </section>

    <section id="answer-card" class="card hidden">
      <h2>Reveal</h2>

      <div class="result-block">
        <div id="correct-status" class="result-status">---</div>

        <div class="reveal-item">
          <div class="label">Correct Form</div>
          <div id="answer" class="correct-form">---</div>
        </div>

        <button id="reveal-next-btn" class="reveal-next-btn" type="button">Next</button>
      </div>

      <div class="verb-info-block">
        <h3>Verb Info</h3>

        <div class="prompt-row">
          <span class="label">Type:</span>
          <span id="verb-type" class="value">---</span>
        </div>

        <div class="prompt-row">
          <span class="label">Ichidan Exception:</span>
          <span id="ichidan-exception" class="value">---</span>
        </div>

        <div class="prompt-row">
          <span class="label">Conjugation Exception:</span>
          <span id="exception" class="value">---</span>
        </div>
      </div>
    </section>

    <section id="settings-card" class="card">
      <div class="section-header">
        <h2>Settings</h2>
        <button id="toggle-forms-btn" class="collapse-btn" type="button">Hide</button>
      </div>

      <div id="settings-container">
        <div class="setting-row">
          <span class="label">Furigana Support</span>
          <button id="furigana-toggle-btn" class="setting-toggle" type="button">Off</button>
        </div>

        <h3>Active Forms</h3>

        <div id="form-toggles" class="toggle-grid"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
